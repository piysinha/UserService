spring.application.name=UserService
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${USERSERVICE_DB_URL}
spring.datasource.username=${USERSERVICE_DB_USERNAME}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql: true
server.port=9000
# Base64-encoded HMAC key (at least 256 bits) that signs login tokens. Generate one with: openssl rand -base64 32
userservice.jwt.secret=${USERSERVICE_JWT_SECRET}

logging.level.org.springframework.security=trace

